const S={page:'dashboard',active:'WB-2206',customers:[{id:'CUS-001',name:'Grand Meridian Hotel',type:'Hospitality',site:'Chennai Central',model:'Customer-owned processing',terms:'Net 30',par:1800},{id:'CUS-002',name:'Lakeside Medical Centre',type:'Healthcare',site:'Madurai Main Hospital',model:'Customer-owned processing',terms:'Net 30',par:1250},{id:'CUS-003',name:'Crest Uniform Rental',type:'Uniform rental',site:'Coimbatore Hub',model:'Laundry-owned rental',terms:'Net 15',par:2400},{id:'CUS-004',name:'Palm Grove Resort',type:'Hospitality',site:'ECR Resort',model:'Laundry-owned rental',terms:'Net 30',par:950}],contracts:[{id:'CTR-101',customer:'Grand Meridian Hotel',model:'Per piece',rate:18,unit:'piece',status:'Active'},{id:'CTR-102',customer:'Lakeside Medical Centre',model:'Per kg',rate:62,unit:'kg',status:'Active'},{id:'CTR-103',customer:'Crest Uniform Rental',model:'Rental + wash',rate:4.5,unit:'piece/week',status:'Active'},{id:'CTR-104',customer:'Palm Grove Resort',model:'Per piece',rate:16,unit:'piece',status:'Active'}],orders:[{id:'SO-1048',customer:'Grand Meridian Hotel',site:'Chennai Central',due:'Today 16:00',priority:'Urgent',type:'Hotel linen',qty:1200,status:'In production'},{id:'SO-1049',customer:'Lakeside Medical Centre',site:'Madurai Main Hospital',due:'Today 18:00',priority:'Critical',type:'Healthcare linen',qty:780,status:'Awaiting QC'},{id:'SO-1050',customer:'Crest Uniform Rental',site:'Coimbatore Hub',due:'Tomorrow 09:00',priority:'Normal',type:'Uniforms',qty:460,status:'New'},{id:'SO-1051',customer:'Palm Grove Resort',site:'ECR Resort',due:'Tomorrow 11:00',priority:'Normal',type:'Rental linen',qty:640,status:'Ready to pack'}],collections:[{id:'COL-8804',customer:'Grand Meridian Hotel',sent:1000,received:1000,kg:285,condition:'Normal soil',status:'Received'},{id:'COL-8805',customer:'Lakeside Medical Centre',sent:800,received:780,kg:240,condition:'Healthcare segregated',status:'Variance'},{id:'COL-8806',customer:'Crest Uniform Rental',sent:470,rec const titles=Object.fromEntries(menu.map(m=>[m[0],m[1]]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const tag=(s,c='')=>`<span class="tag ${c}">${s}</span>`;const btn=(s,fn,c='')=>`<button class="btn ${c}" onclick="${fn}">${s}</button>`;const kpi=(l,v,f,c='')=>`<div class="card"><div class="klabel">${l}</div><div class="kval ${c}">${v}</div><div class="sub">${f}</div></div>`;const sec=(s,r='')=>`<div class="section"><h2>${s}</h2>${r}</div>`;const head=(t,p,a='')=>`<div class="head"><div><h1>${t}</h1><p>${p}</p></div><div class="actions">${a}</div></div>`;const table=(hs,rs)=>`<div class="tablewrap"><table><thead><tr>${hs.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const views={
dashboard:()=>`${head('Laundry operations, connected end to end','Track custody, processing, quality, customer service and financial reconciliation.',btn('＋ New collection','modal("collection")','primary')+btn('＋ Wash batch','modal("batch")'))}<div class="notice warn"><b>Live demo scenario:</b> Grand Meridian sent 1,000 pieces. 980 were sorted; 970 washed; 963 passed QC; 5 need rewash and 2 were rejected. The 30-piece upstream difference must be investigated—not automatically charged as loss.</div><div class="grid kpis">${kpi('Inbound today',2250,'3 collection manifests')}${kpi('Passed QC',963,'WB-2206 accepted pieces','green')}${kpi('Open exceptions',S.claims.filter(c=>c.status!=='Resolved').length,'Assign owner & resolve','amber')}${kpi('Orders due today',2,'Hotel and healthcare')}</div><div class="grid cols2"><div class="card"><h3>Today's operating flow</h3><div class="sub">Illustrative stage counts, not a common denominator</div>${[['Collected',1470,1550],['Received',1450,1550],['Sorted',1750,2000],['Washed',1730,2000],['Passed QC',963,1730],['Packed',640,1500]].map(x=>`<div class="barrow"><span>${x[0]}</span><div class="bar"><span style="width:${Math.min(100,x[1]/x[2]*100)}%"></span></div><b>${x[1]}</b></div>`).join('')}<div class="notice">Use Batch Trace for one batch’s exact reconciliation. Cross-batch totals are illustrative.</div></div><div class="card"><h3>Priority exceptions</h3><div class="mini"><b>COL-8805 · 20 pieces short at receipt</b><small>Lakeside Medical Centre · Investigate custody variance</small>${btn('Investigate','nav("claims")','sm')}</div><div class="mini"><b>WB-2206 · 30 pieces not washed</b><small>20 sorting difference + 10 sorted-to-washed difference</small>${btn('Trace batch','trace("WB-2206")','sm')}</div><div class="mini"><b>Washer W-02 maintenance due</b><small>Check preventive maintenance before scheduling</small>${btn('Open equipment','nav("maintenance")','sm')}</div><div class="mini"><b>SO-1048 due today 16:00</b><small>Grand Meridian · 1,200 pieces</small>${btn('Open orders','nav("orders")','sm')}</div></div></div>${sec('Recent activity')}<div class="card">${S.events.map(e=>`<div class="event"><b>${e[1]}</b><small>${e[0]} · ${e[2]}</small></div>`).join('')}</div>${sec('Fast access')}<div class="grid cols3"><div class="card"><h3>Collection handover</h3><p class="sub">Expected vs received counts, weighment and variance.</p>${btn('Receive linen','modal("collection")','primary')}</div><div class="card"><h3>Production trace</h3><p class="sub">Batch quantities, cycle, QC and disposition.</p>${btn('Open batch','trace("WB-2206")')}</div><div class="card"><h3>Billing & finance</h3><p class="sub">Charges based on verified service evidence.</p>${btn('Open finance','nav("finance")')}</div></div>`,
customers:()=>`${head('Customers & service sites','Maintain customer, site, ownership model, contact, linen par level and special handling instructions.',btn('＋ Add customer','modal("customer")','primary'))}<div class="grid kpis">${kpi('Active customers',S.customers.length,'Sample customers')}${kpi('Customer-owned',S.customers.filter(c=>c.model.includes('Customer-owned')).length,'Laundry service only')}${kpi('Rental customers',S.customers.filter(c=>c.model.includes('rental')).length,'Provider-owned linen')}${kpi('Sites',S.customers.length,'Illustrative locations')}</div>${table(['Customer','Industry','Site','Ownership model','Terms','Par level','Action'],S.customers.map(c=>[`<b>${c.name}</b><br><small>${c.id}</small>`,c.type,c.site,c.model,c.terms,c.par,btn('New order',`newOrder('${c.id}')`,'sm')]))}<div class="grid cols2" style="margin-top:14px"><div class="card"><h3>Customer setup checklist</h3>${['Pickup / delivery windows','Approved textile types and packaging','Ownership and liability clauses','Soil / contamination handling instructions','SLA and escalation contacts','Par levels and emergency buffer','Rates, tax and invoice grouping'].map(x=>`<div class="mini">${x}</div>`).join('')}</div><div class="card"><h3>Ownership is a financial control</h3><div class="notice">Customer-owned: generally charge for processing. Laundry-owned rental: track asset custody, rental period, wear, loss and replacement. Always follow signed contract terms.</div></div></div>`,
contracts:()=>`${head('Contracts & price lists','Define charging basis, rate, SLA, loss terms, rewash rules, minimum charges, taxes and approvals.',btn('＋ New contract','modal("contract")','primary'))}${table(['Contract','Customer','Charging model','Rate','Status','Action'],S.contracts.map(c=>[c.id,c.customer,c.model,`${money(c.rate)} / ${c.unit}`,tag(c.status,c.status==='Active'?'green':'amber'),btn('Preview','previewContract(\''+c.id+'\')','sm')]))}<div class="grid cols3" style="margin-top:14px">${[['Ownership','Customer / provider / mixed'],['Billing','Per piece, kg, rental, flat or hybrid'],['Service levels','Turnaround, pickup windows, penalties'],['Quality','Rewash, defects, acceptance rules'],['Loss clauses','Evidence, thresholds, approval'],['Commercial','Tax, discounts, credit terms']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="sub">${x[1]}</p></div>`).join('')}</div>`,

collection:()=>`${head('Collection & dirty receiving','Record declared quantity, actual receipt, bag/seal, weight, condition, custody and variance.',btn('＋ Record collection','modal("collection")','primary'))}<div class="notice warn"><b>Control:</b> Keep sender-declared and received quantities separately. Healthcare linen requires site-approved segregation and safe-handling procedures.</div>${table(['Manifest','Customer','Declared','Received','Variance','Weight','Condition','Status','Action'],S.collections.map(c=>[c.id,c.customer,c.sent,c.received,c.sent===c.received?tag('0','green'):tag((c.received-c.sent)+' pcs','red'),c.kg+' kg',c.condition,tag(c.status,c.status==='Variance'?'red':'green'),btn('Reconcile','reconcile(\''+c.id+'\')','sm')+' '+btn('Create batch','batchFrom(\''+c.id+'\')','sm')]))}${sec('Custody workflow')}<div class="workflow">${['Route & driver','Customer handover','Bag/seal count','Weigh-in','Variance case','Dirty staging'].map((x,i)=>`<div class="step"><div class="num">${i+1}</div><b>${x}</b><small>${['Pickup window','Sender/receiver','Bag identifiers','Scale ticket','Reason & owner','Segregated zone'][i]}</small></div>`).join('')}</div><div class="grid cols2"><div class="card"><h3>Required evidence</h3>${['Site, pickup time, sender and receiver','Declared count / weight and source','Bag, cart or seal identifiers','Actual received count and scale ticket','Condition / contamination category','Acknowledgement and photos where required','Variance reason and claim reference'].map(x=>`<div class="mini">${x}</div>`).join('')}</div><div class="card"><h3>Reconciliation preview</h3><div class="field"><label>Manifest</label><select id="recSel" onchange="recPreview()">${S.collections.map(c=>`<option>${c.id}</option>`).join('')}</select></div><div id="recView"></div>${btn('Investigate selected','reconcile(document.getElementById("recSel").value)','primary')}</div></div>`,
sorting:()=>`${head('Sorting & classification','Classify textile by customer, family, soil category, contamination risk and approved processing route.',btn('＋ Record sort lot','modal("sort")','primary'))}<div class="grid cols3"><div class="card"><h3>Normal soil</h3><p class="sub">Route by textile, colour and approved recipe.</p>${tag('Standard route','green')}</div><div class="card"><h3>Heavy soil / stain</h3><p class="sub">Separate stain treatment and rewash disposition.</p>${tag('Special treatment','amber')}</div><div class="card"><h3>Healthcare / infectious risk</h3><p class="sub">Follow facility SOP, segregation and PPE controls.</p>${tag('Controlled route','red')}</div></div>${sec('Sample sort lots')}${table(['Lot','Source','Customer','Input','Sorted','Difference','Route'],[['SL-5101','COL-8804','Grand Meridian Hotel',1000,980,tag('20','amber'),'Hotel route'],['SL-5102','COL-8805','Lakeside Medical Centre',780,770,tag('10','amber'),'Healthcare route']])}<div class="notice">A sorting difference must be reason-coded—counting error, foreign item, damage, unidentified textile or other. It is not automatically a loss claim.</div>`,
production:()=>`${head('Wash & production','Plan batches against machine capacity, approved recipes, chemical usage, cycle evidence and delivery commitments.',btn('＋ Create batch','modal("batch")','primary'))}<div class="grid kpis">${kpi('Active batches',S.batches.filter(b=>b.status==='Washing'||b.status==='Scheduled').length,'Scheduled / washing')}${kpi('Available washers',S.machines.filter(m=>m.id.startsWith('W')&&m.status==='Available').length,'Check maintenance')}${kpi('Selected batch',S.active,'Batch trace')}${kpi('Passed QC',S.batches.reduce((a,b)=>a+b.passed,0),'Accepted pieces','green')}</div>${table(['Batch','Customer','Source','Input','kg','Machine','Recipe','Status','Action'],S.batches.map(b=>[`<a onclick="trace('${b.id}')">${b.id}</a>`,b.customer,b.source,b.input,b.kg,b.machine,b.recipe,tag(b.status,b.status==='QC complete'?'green':'blue'),btn('Update stage',`updateBatch('${b.id}')`,'sm')]))}${sec('Production controls')}<div class="grid cols2"><div class="card"><h3>Batch execution checklist</h3>${['Correct source lot and ownership','Textile compatibility and load capacity','Approved recipe and revision','Chemical lot / dosing evidence','Operator and shift recorded','Cycle time/temperature/parameters captured','Deviation and downtime reason','Output quantity linked to QC'].map(x=>`<div class="mini">${x}</div>`).join('')}</div><div class="card"><h3>Equipment readiness</h3>${S.machines.map(m=>`<div class="mini"><b>${m.id} · ${m.name}</b><small>${m.cap} kg capacity · ${m.status} · ${m.pm}</small></div>`).join('')}${btn('Maintenance','nav("maintenance")')}</div></div><div class="notice warn">Healthcare recipes and process limits must be validated by the responsible quality / infection-prevention authority and equipment manufacturer. This prototype does not certify a wash cycle.</div>`,
quality:()=>`${head('Quality, rewash & disposition','Separate passed, rewash, repair, reject, retirement and pending quantities.',btn('＋ Record QC','modal("qc")','primary'))}<div class="grid kpis">${kpi('Passed',S.batches.reduce((a,b)=>a+b.passed,0),'Released quantity','green')}${kpi('Rewash',S.batches.reduce((a,b)=>a+b.rewash,0),'Return to process','amber')}${kpi('Rejected',S.batches.reduce((a,b)=>a+b.reject,0),'Disposition required','red')}${kpi('Pending',S.batches.reduce((a,b)=>a+Math.max(0,b.washed-b.passed-b.rewash-b.reject),0),'Needs classification','amber')}</div>${table(['Batch','Washed','Passed','Rewash','Rejected','Pending','Pass rate','Action'],S.batches.map(b=>[b.id,b.washed,b.passed,b.rewash,b.reject,Math.max(0,b.washed-b.passed-b.rewash-b.reject),`${b.washed?Math.round(b.passed/b.washed*100):0}%`,btn('Inspect','qcFor(\''+b.id+'\')','sm')]))}<div class="grid cols3" style="margin-top:14px">${[['Pass','Meets approved criteria; eligible for allocation.','green'],['Rewash / rework','Linked reprocessing event; repeat QC.','amber'],['Reject / retire','Quarantine and authorize repair, claim or disposal.','red']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="sub">${x[1]}</p>${tag('Separate disposition',x[2])}</div>`).join('')}</div><div class="notice">WB-2206: 970 washed = 963 passed + 5 rewash + 2 rejected. The 30-piece difference before washing must be reconciled at upstream stages before any loss attribution.</div>`,
inventory:()=>`${head('Linen inventory & lifecycle','Ownership-aware stock across dirty, WIP, quarantined, clean released, customer site, rental, damaged and retired states.',btn('＋ Stock movement','modal("stock")','primary'))}${table(['Item','Ownership','Available clean','Par','Gap to par','Replacement cost','Gap value','Action'],S.stock.map((s,i)=>{let g=Math.max(0,s.par-s.qty);return [s.item,s.owner,s.qty,s.par,g?tag(g,'amber'):tag('At par','green'),money(s.cost),money(g*s.cost),btn('Move / count',`stockMove(${i})`,'sm')]}))}${sec('Lifecycle state model')}<div class="workflow">${['Customer dirty','Sorted / WIP','In wash','Clean pending QC','Clean released','Customer / rental'].map((x,i)=>`<div class="step"><div class="num">${i+1}</div><b>${x}</b><small>${['Custody received','Not available','Processing','Quarantined','Available stock','Issued / out on rent'][i]}</small></div>`).join('')}</div><div class="grid cols2"><div class="card"><h3>Lifecycle data</h3>${['Ownership and customer assignment','Tag / SKU / lot and location','Wash-cycle count where item-level tracking exists','Damage, repair and wear history','Retirement threshold / condemnation','Replacement and disposal record'].map(x=>`<div class="mini">${x}</div>`).join('')}</div><div class="card"><h3>Stock availability rule</h3><div class="notice">Available clean = physically present and QC released − reservations − quarantined/damaged. Dirty linen and WIP cannot count as ready-to-ship stock. RFID is optional; do not imply hardware is installed unless integrated.</div></div></div>`,
dispatch:()=>`${head('Packing & dispatch','Allocate QC-released quantities, pack clean linen safely, prepare route manifests and capture proof of delivery.',btn('＋ Create dispatch','modal("dispatch")','primary'))}${table(['Dispatch','Customer','Order','Planned','Packed','Delivered','Route','Status','Actions'],S.dispatch.map(d=>[d.id,d.customer,d.order,d.planned,d.packed,d.delivered,d.route,tag(d.status,d.status==='Delivered'?'green':'blue'),btn('POD / open',`openPOD('${d.id}')`,'sm')+' '+btn('Complete',`openPOD('${d.id}')`,'sm')]))}${sec('Dispatch release checks')}<div class="grid cols2"><div class="card"><h3>Before departure</h3>${['Only QC-released quantities allocated','Correct customer and delivery window','Clean packaging and carts','Packed count reconciles to manifest','Driver, vehicle, route and seal recorded','Healthcare linen protected from recontamination','Delivery note generated'].map(x=>`<div class="mini">${x}</div>`).join('')}</div><div class="card"><h3>Proof of delivery</h3><div class="notice warn">Record delivered quantity separately from dispatched quantity. A short delivery requires an exception reason and investigation.</div>${btn('Complete DSP-7721','openPOD("DSP-7721")','primary')}</div></div>`,
claims:()=>`${head('Reconciliation & claims','Investigate differences across handover, receiving, sorting, washing, QC, packing and delivery before assigning liability.',btn('＋ New case','modal("claim")','primary'))}<div class="grid kpis">${kpi('Open cases',S.claims.filter(c=>c.status!=='Resolved').length,'Needs investigation','amber')}${kpi('Pieces under review',S.claims.filter(c=>c.status!=='Resolved').reduce((a,c)=>a+c.qty,0),'Across cases')}${kpi('Resolved',S.claims.filter(c=>c.status==='Resolved').length,'Audit trail retained','green')}${kpi('WB-2206 upstream',30,'20 + 10 stage differences','red')}</div>${table(['Case','Source','Customer','Issue','Qty','Owner','Status','Action'],S.claims.map(c=>[c.id,c.source,c.customer,c.kind,c.qty,c.owner,tag(c.status,c.status==='Resolved'?'green':'amber'),btn('Open',`openClaim('${c.id}')`,'sm')+' '+(c.status!=='Resolved'?btn('Resolve',`resolveClaim('${c.id}')`,'sm'):'')]))}${sec('Batch trace · WB-2206')}<div class="card"><div class="workflow">${[['Received','1,000'],['Sorted','980'],['Washed','970'],['Passed','963'],['Rewash','5'],['Rejected','2']].map((x,i)=>`<div class="step"><div class="num">${i+1}</div><b>${x[0]}</b><small>${x[1]} pieces</small></div>`).join('')}</div><div class="grid cols3"><div class="notice warn">20 pieces: received-to-sorted difference; record cause.</div><div class="notice warn">10 pieces: sorted-to-washed difference; trace WIP/process record.</div><div class="notice ok">7 washed pieces: 5 rewash + 2 rejected.</div></div><b>Control:</b> no customer charge until ownership, contract, evidence, stage counts and approval are verified. ${btn('Open batch trace','trace("WB-2206")','primary')}</div>`,
maintenance:()=>`${head('Equipment & utilities','Machine readiness, preventive maintenance, downtime, water, energy, chemical consumption and cost per accepted unit.',btn('＋ Maintenance work order','modal("maintenance")','primary'))}${table(['Asset','Name','Capacity','Status','Maintenance','Action'],S.machines.map(m=>[m.id,m.name,m.cap+' kg',tag(m.status,m.status==='Running'?'blue':'green'),m.pm,btn('Update','editMachine(\''+m.id+'\')','sm')+' '+btn('Log downtime','downtime(\''+m.id+'\')','sm')]))}<div class="grid cols3" style="margin-top:14px">${[['Water','Meter integration not configured'],['Energy','kWh per batch not configured'],['Chemicals','Actual consumption entry required']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="sub">${x[1]}</p><div class="kval">—</div></div>`).join('')}</div><div class="notice">Do not invent savings. Actual meters and consumption are needed to calculate cost per kg/piece, downtime, rewash cost and utility intensity.</div>`,

procurement:()=>`${head('Procurement & replenishment','Purchase linen, chemicals, packaging, spare parts and PPE with supplier qualification, receipt inspection and invoice matching.',btn('＋ Purchase request','modal("purchase")','primary'))}${table(['Requirement','Category','Position','Trigger','Suggested action'],[['Flat sheet — hotel','Linen replacement','1,320 / par 1,500',tag('180 below par','amber'),'Create request'],['Pillowcase — hotel','Linen replacement','840 / par 900',tag('60 below par','amber'),'Create request'],['Laundry detergent','Chemical','Qty not configured','Min/max + demand','Set reorder point'],['Washer seal kit','Spare part','Qty not configured','Lead time + criticality','Check stores'],['Clean linen bags','Packaging','Qty not configured','Dispatch forecast','Check stores']])}${sec('Purchase lifecycle')}<div class="workflow">${['Demand / reorder','Supplier approval','Purchase order','Receipt & QC','PO / receipt / bill match','Payment & GL'].map((x,i)=>`<div class="step"><div class="num">${i+1}</div><b>${x}</b><small>${['MRP / par','Approved source','Rate / lead time','Qty / quality','Invoice check','Authorization'][i]}</small></div>`).join('')}</div>`,
finance:()=>`${head('Billing & finance','Generate charges from verified work, contract rates and delivery evidence; manage claims, credits, tax and collections.',btn('＋ Invoice draft','generateInvoice()','primary'))}<div class="grid kpis">${kpi('Draft invoices',S.invoices.filter(i=>i.status==='Draft').length,'Needs review')}${kpi('Draft value',money(S.invoices.filter(i=>i.status==='Draft').reduce((a,i)=>a+i.amount,0)),'Before tax')}${kpi('Submitted',S.invoices.filter(i=>i.status==='Submitted').length,'Sample invoices')}${kpi('Open cases',S.claims.filter(c=>c.status!=='Resolved').length,'No automatic loss charges','amber')}</div>${table(['Invoice','Customer','Basis','Amount','Status','Action'],S.invoices.map(i=>[i.id,i.customer,i.basis,money(i.amount),tag(i.status,i.status==='Submitted'?'green':'amber'),btn(i.status==='Draft'?'Submit':'Details',`submitInvoice('${i.id}')`,'sm')]))}<div class="grid cols2" style="margin-top:14px"><div class="card"><h3>Charge components</h3>${['Processing per piece / kg','Rental per item / day / week','Minimum service charge','Pickup / urgent service surcharge','Rewash / repair where contract permits','Approved lost/damaged item charge','Service credits and disputed quantities','Tax and payment terms'].map(x=>`<div class="mini">${x}</div>`).join('')}</div><div class="card"><h3>Cost to serve</h3>${['Labour','Water and energy','Chemicals / packaging','Machine maintenance','Transport / fuel','Rewash / replacement','Customer-specific service effort'].map(x=>`<div class="mini">${x}</div>`).join('')}<div class="notice warn">Sample rates only. Contract terms, tax and actual evidence must be validated before posting.</div></div></div>`,
compliance:()=>`${head('Hygiene, safety & compliance','Auditable controls for dirty/clean separation, validated processing, safe handling, packaging, maintenance and incident response.',btn('＋ Compliance record','modal("compliance")','primary'))}<div class="notice danger"><b>Healthcare caution:</b> Software supports records and workflows; it does not certify infection control. Site-specific SOPs, local requirements and qualified authorities govern actual practice.</div>${table(['Control','Frequency','Owner','Evidence','Status','Action'],[['Dirty / clean separation','Each shift','Shift supervisor','Area inspection',tag('To verify','amber'),btn('Record','modal("compliance")','sm')],['Wash-cycle parameters','Each batch','Production / QA','Cycle log / deviation',tag('Batch-linked','blue'),btn('Record','modal("compliance")','sm')],['Clean cart / packaging','Each dispatch','Dispatch lead','Cleaning log',tag('To verify','amber'),btn('Record','modal("compliance")','sm')],['PPE / safe handling','Each shift','HSE / supervisor','Training evidence',tag('Role-linked','blue'),btn('Record','modal("compliance")','sm')],['Chemical SDS / storage','Periodic','EHS / stores','SDS and inspection',tag('Site-specific','blue'),btn('Record','modal("compliance")','sm')],['Effluent / environment','Permit schedule','Facility manager','Monitoring records',tag('Site-specific','blue'),btn('Record','modal("compliance")','sm')]])}${sec('Incident & corrective action')}<div class="grid cols2"><div class="card"><h3>Incident types</h3><p>Cross-contamination · Chemical spill · Injury · Machine fault · Damaged linen · Lost item · Customer complaint · Environmental exceedance</p>${btn('Log incident','modal("compliance")','primary')}</div><div class="card"><h3>Closure logic</h3><p>Contain → record evidence → assess risk → assign corrective action → verify effectiveness → authorized closure.</p></div></div>`,
reports:()=>`${head('Reports & analytics','Operational reports should explain flow, cost, service quality, exposure and action owners.',btn('Export batch CSV','exportCSV()','primary'))}<div class="grid kpis">${kpi('Batch pass rate',Math.round(S.batches.reduce((a,b)=>a+b.passed,0)/Math.max(1,S.batches.reduce((a,b)=>a+b.washed,0))*100)+'%','Passed / washed')}${kpi('Rewash rate',Math.round(S.batches.reduce((a,b)=>a+b.rewash,0)/Math.max(1,S.batches.reduce((a,b)=>a+b.washed,0))*100)+'%','Rewash / washed','amber')}${kpi('Reject rate',Math.round(S.batches.reduce((a,b)=>a+b.reject,0)/Math.max(1,S.batches.reduce((a,b)=>a+b.washed,0))*100)+'%','Rejected / washed','red')}${kpi('Inbound variance',S.collections.reduce((a,c)=>a+Math.abs(c.sent-c.received),0)+' pcs','Absolute manifest variance')}</div><div class="grid cols3">${[['Daily collection & weighment','Expected vs received, kg, bag count, owner'],['Batch yield / mass balance','Input → sorted → washed → QC → packed'],['Customer linen loss ledger','Owned stock, returns, damage, missing and recovery'],['On-time-in-full','Orders delivered on time and complete'],['Defect Pareto','Rewash, defect, machine, recipe and cost'],['Machine utilization','Runtime, idle, downtime, PM compliance'],['Cost per accepted kg/piece','Labour, utilities, chemicals, transport, rework'],['Customer profitability','Revenue less cost to serve'],['Rental par & ageing','Stock at customer, idle stock, shortages'],['Water / energy intensity','Consumption per kg and batch'],['Invoice reconciliation','Contract basis vs verified service'],['Safety action ageing','Open deviations and overdue actions']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="sub">${x[1]}</p>${btn('Preview sample',`report('${x[0]}')`,'sm')}</div>`).join('')}</div>${sec('Batch data')}${table(['Batch','Input','Sorted','Washed','Passed','Rewash','Rejected','Input-to-washed difference'],S.batches.map(b=>[b.id,b.input,b.sorted,b.washed,b.passed,b.rewash,b.reject,b.input-b.washed]))}`,
setup:()=>`${head('Setup & rulebook','Configure operating model, process controls, approvals and integration points. Changes apply to this demo session.',btn('Reset demo','resetDemo()','warn'))}<div class="grid cols2"><div class="card"><h3>Site configuration</h3><div class="field"><label>Default site</label><input id="site" value="${S.settings.site}"></div><div class="field"><label>Illustrative tax rate (%)</label><input id="tax" type="number" value="${S.settings.tax}"></div><div class="field"><label>Rated daily throughput (kg)</label><input id="cap" type="number" value="${S.settings.capacity}"></div>${btn('Save settings','saveSettings()','primary')}</div><div class="card"><h3>Workflow rules</h3>${[['qc','Block dispatch without QC release'],['pod','Require POD before final billing'],['claims','Create case on handover variance'],['cycle','Require process evidence for controlled recipes'],['negative','Allow negative clean stock']].map(x=>`<div class="mini"><label><input type="checkbox" ${S.rules[x[0]]?'checked':''} onchange="S.rules['${x[0]}']=this.checked;toast('Rule changed for demo session.')"> ${x[1]}</label></div>`).join('')}</div></div>${sec('Master data before go-live')}<div class="grid cols3">${[['Textile / item','SKU, textile family, size, colour, owner, tag, cost'],['Customer / site','Windows, par, contacts, handling instructions'],['Wash recipe','Validated cycle, machine, dosage, revision, approval'],['Machine','Capacity, programs, utility meter, PM'],['Contract','Rates, SLA, ownership, loss clauses, tax'],['Reason codes','Variance, stain, damage, rewash, rejection, retirement'],['Users / roles','Operator, QC, driver, finance, QA, admin'],['Integrations','Scale, RFID, barcode, route app, accounting'],['Document control','SOP version, approver, effective date, training']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="sub">${x[1]}</p></div>`).join('')}</div>`,
blueprint:()=>`${head('Functional consultant & developer blueprint','Proposed product model, logical records, states, permissions, integrations and acceptance tests. Not a verified ERPNext implementation.',btn('Export blueprint','exportBlueprint()','primary'))}<div class="notice"><b>Architecture principle:</b> preserve event history. Never silently overwrite declared counts, actual counts, process output or delivery evidence. Keep physical location, custody and financial ownership distinct.</div>${sec('Suggested DocTypes / entities')}${table(['Domain','Proposed entity','Purpose / key relationship'],[['Customer','Laundry Customer / Service Site','Ownership, contacts, handling → orders / manifests'],['Commercial','Laundry Contract / Rate Card','Rate, billing basis, SLA, liability → invoice'],['Demand','Laundry Service Order','Request, due date, quantity → batches / dispatch'],['Custody','Collection Manifest','Declared/actual counts, weight, signatures → sort lot / case'],['Production','Sort Lot / Wash Batch','Input/output, textile, route → recipe / machine / QC'],['Processing','Wash Program / Cycle Log','Recipe revision and actual evidence → batch / deviations'],['Quality','QC Inspection / Disposition','Pass, rewash, repair, reject, retire → stock / CAPA'],['Inventory','Linen Stock Ledger / Movement','Owner, status, location, quantity → item / site / order'],['Dispatch','Dispatch Manifest / POD','Packed, sent, delivered, accepted → invoice'],['Exceptions','Reconciliation Case','Variance, evidence, owner, approval → source document'],['Assets','Asset / Maintenance Work Order','PM, downtime, spares, meter readings → production'],['Finance','Service Invoice / Charge Line','Contract-driven charges → POD / credit / GL'],['Compliance','Hygiene Check / Incident / CAPA','SOP evidence, deviation, corrective action'],['People','Shift / Skill Assignment','Competency and task assignment → employee / machine'],['Procurement','Purchase Request / PO / Receipt','Replenishment, supplier, inspection, invoice match']])}${sec('Critical state transitions')}<div class="grid cols2"><div class="card"><h3>Batch lifecycle</h3><p>Created → Received → Classified → Sorted → Scheduled → Washing → Process complete → QC pending → Released / Rewash / Rejected / Quarantined → Allocated → Packed → Dispatched → Delivered → Reconciled.</p><div class="notice warn">Rewash is a linked loop; rejected stock cannot become available without authorized disposition.</div></div><div class="card"><h3>Claim lifecycle</h3><p>Detected → Evidence pending → Investigation → Customer/internal review → Proposed resolution → Approval → Resolved / Disputed → Closed.</p><div class="notice">Never assign liability from a numeric variance alone.</div></div></div>${sec('Roles and controls')}${table(['Role','Allowed work','Approval / restriction'],[['Receiving operator','Manifest, weight, received quantity','Cannot approve own disputed loss claim'],['Production supervisor','Sort lots, batches, machine status','Cannot bypass QC release'],['Quality lead','Inspection and disposition','QC release per SOP; cannot silently alter receipt'],['Dispatch / driver','Packing, route, POD','Cannot invoice or waive claims'],['Customer service','Case and customer communication','Recommends resolution'],['Finance','Invoices, credits, collections','Loss charge needs evidence and approval'],['Admin','Masters, rules, integration','Production edits must be audited']])}${sec('Integrations & acceptance tests')}<div class="grid cols3">${[['Scale','Gross/tare/net, unit, scale ID, timestamp, ticket'],['RFID / barcode','Tag map, scan events, duplicate scans, offline queue'],['Accounting','Customer, supplier, tax, invoice, payment, GL'],['Driver app','Stops, manifest, exception, signature, photo'],['Customer portal','Orders, par, POD, disputes, invoice'],['Security','Roles, audit log, attachments, retention, backup']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="sub">${x[1]}</p></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Acceptance tests</h3>${['Inbound variance retains declared and received values and creates a case.','Dirty or quarantined stock cannot be allocated as clean.','Controlled batch cannot release without cycle evidence and QC disposition.','Rewash is linked and not double-counted as finished output.','Dispatch cannot exceed released stock without authorized exception.','Delivered quantity is independent of dispatched quantity; shortfall opens a case.','Billing uses contract version and verified service evidence, not planned quantity.','Loss charge needs evidence, contract basis and approval.','Customer-owned and laundry-owned linen are valued separately.','Corrections retain original values, reason, user, timestamp and approval.'].map((x,i)=>`<div class="mini"><label><input type="checkbox"> ${i+1}. ${x}</label></div>`).join('')}</div>`};
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}function close(){document.getElementById('back').classList.remove('show')}function showModal(title,body,save){document.getElementById('mtitle').textContent=title;document.getElementById('mbody').innerHTML=body;document.getElementById('msave').onclick=save;document.getElementById('back').classList.add('show')}function f(label,id,val='',type='text',opts=null){return `<div class="field"><label>${label}</label>${opts?`<select id="${id}">${opts.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input id="${id}" type="${type}" value="${String(val).replace(/"/g,'&quot;')}">`}</div>`}function val(id){return document.getElementById(id).value}function modal(type){let body='',save=()=>close(),title='Action';if(type==='collection'){title='Record collection / dirty receipt';body=`<div class="formgrid">${f('Manifest ID','id','COL-'+(8810+S.collections.length))}${f('Customer','cust','',null,S.customers.map(c=>c.name))}${f('Declared pieces','sent',1000,'number')}${f('Received pieces','recv',980,'number')}${f('Net weight (kg)','kg',280,'number')}${f('Condition','cond','',null,['Normal soil','Heavy soil / stain','Healthcare segregated','Infectious risk per site SOP','Uniforms','Mixed / classify'])}${f('Bag / seal / scale reference','ref','TICKET-001')}${f('Variance note','note','Recount if discrepancy')}</div><div class="notice">Declared and received quantities remain separate. Variance creates a case for investigation.</div>`;save=()=>{let sent=+val('sent'),received=+val('recv');if(sent<0||received<0)return toast('Quantity cannot be negative.');let c={id:val('id'),customer:val('cust'),sent,received,kg:+val('kg'),condition:val('cond'),status:sent===received?'Received':'Variance'};S.collections.unshift(c);if(sent!==received&&S.rules.claims)S.claims.unshift({id:'CLM-'+(303+S.claims.length),source:c.id,customer:c.customer,kind:'Inbound quantity variance',qty:Math.abs(sent-received),owner:'Receiving supervisor',status:'Open',note:val('note')+'; '+val('ref')});S.events.unshift(['Now','Collection '+c.id+' recorded',`${received} of ${sent} received · ${c.kg} kg`]);close();nav('collection');toast(sent===received?'Collection saved':'Collection saved; variance case created')}}else if(type==='batch'){title='Create wash batch';body=`<div class="formgrid">${f('Batch ID','id','WB-'+(2208+S.batches.length))}${f('Source manifest','src','',null,S.collections.map(c=>c.id))}${f('Customer','cust','',null,S.customers.map(c=>c.name))}${f('Input pieces','input',500,'number')}${f('Weight (kg)','kg',150,'number')}${f('Machine','machine','',null,S.machines.map(m=>m.id+' — '+m.name))}${f('Approved wash recipe','recipe','',null,['Hotel standard — validate SOP','Healthcare validated cycle — approved SOP required','Uniform standard — validate fabric care','Delicate / low temperature — validate recipe'])}</div><div class="notice warn">Only use an approved site recipe for controlled healthcare processing. This demo does not validate cycle efficacy.</div>`;save=()=>{let n=+val('input');if(n<=0)return toast('Input must be positive.');let src=S.collections.find(c=>c.id===val('src'));let b={id:val('id'),customer:val('cust'),source:val('src'),input:n,sorted:0,washed:0,passed:0,rewash:0,reject:0,kg:+val('kg'),machine:val('machine').split(' — ')[0],recipe:val('recipe'),status:'Scheduled'};S.batches.unshift(b);S.active=b.id;close();nav('production');toast('Batch created; update each process stage as work occurs.')}}else if(type==='order'){title='Create service order';body=`<div class="formgrid">${f('Order ID','id','SO-'+(1052+S.orders.length))}${f('Customer','cust','',null,S.customers.map(c=>c.name))}${f('Site','site','Main site')}${f('Due date / time','due','Tomorrow 16:00')}${f('Priority','priority','',null,['Normal','Urgent','Critical'])}${f('Service type','type','',null,['Hotel linen','Healthcare linen','Uniforms','Rental linen','Wash by kg','Special care'])}${f('Quantity','qty',500,'number')}${f('Status','status','New',null,['New','Scheduled','In production','Awaiting QC','Ready to pack'])}</div>`;save=()=>{if(+val('qty')<=0)return toast('Quantity must be positive.');let c=S.customers.find(c=>c.name===val('cust'));S.orders.unshift({id:val('id'),customer:c.name,site:val('site')||c.site,due:val('due'),priority:val('priority'),type:val('type'),qty:+val('qty'),status:val('status')});close();nav('orders');toast('Service order created')}}else if(type==='customer'){title='Add customer / site';body=`<div class="formgrid">${f('Customer name','name')}${f('Industry','type','',null,['Hospitality','Healthcare','Uniform rental','Commercial laundry','Other'])}${f('Service site','site')}${f('Ownership model','model','',null,['Customer-owned processing','Laundry-owned rental','Mixed'])}${f('Payment terms','terms','',null,['Net 7','Net 15','Net 30','Net 45'])}${f('Par level (pieces)','par',1000,'number')}</div>`;save=()=>{if(!val('name').trim())return toast('Enter customer name.');S.customers.push({id:'CUS-'+String(S.customers.length+1).padStart(3,'0'),name:val('name'),type:val('type'),site:val('site')||'Main site',model:val('model'),terms:val('terms'),par:+val('par')});close();nav('customers');toast('Customer added')}}else if(type==='contract'){title='Create contract';body=`<div class="formgrid">${f('Contract ID','id','CTR-'+(105+S.contracts.length))}${f('Customer','cust','',null,S.customers.map(c=>c.name))}${f('Charging model','model','',null,['Per piece','Per kg','Rental + wash','Flat monthly fee','Hybrid / tiered'])}${f('Rate (₹)','rate',18,'number')}${f('Billing unit','unit','',null,['piece','kg','piece/week','piece/day','order','month'])}</div>`;save=()=>{if(+val('rate')<0)return toast('Rate cannot be negative.');S.contracts.unshift({id:val('id'),customer:val('cust'),model:val('model'),rate:+val('rate'),unit:val('unit'),status:'Draft'});close();nav('contracts');toast('Contract draft saved. Complete liability, SLA and approval details before activation.')}}else if(type==='sort'){title='Record sort lot';body=`<div class="formgrid">${f('Sort lot ID','id','SL-'+(5103+S.collections.length))}${f('Source manifest','src','',null,S.collections.map(c=>c.id))}${f('Category','cat','',null,['Hotel linen — normal','Heavy soil / stain','Healthcare — segregated','Uniforms','Mixed / unidentified'])}${f('Input pieces','input',100,'number')}${f('Sorted pieces','out',95,'number')}${f('Variance reason','reason','',null,['Pending recount','Counting correction','Foreign / mixed item','Damaged item','Other'])}</div>`;save=()=>{if(+val('out')>+val('input'))return toast('Sorted output cannot exceed input without documented correction.');close();toast('Sort lot saved. '+(+val('input')-+val('out'))+' pieces need reason-coded disposition.')}}else if(type==='qc'){title='Record QC disposition';body=`<div class="formgrid">${f('Batch','batch','',null,S.batches.map(b=>b.id))}${f('Inspected / washed quantity','washed',100,'number')}${f('Passed','pass',95,'number')}${f('Rewash','rewash',3,'number')}${f('Rejected','reject',2,'number')}${f('Inspector','inspector','QC-004')}${f('Defect reason','reason','',null,['Appearance / stain','Foreign item','Tear / damage','Residual moisture','Odour','Process deviation','Other'])}</div><div class="notice">Passed + rewash + rejected cannot exceed inspected quantity. Any remainder stays pending disposition.</div>`;save=()=>{let b=S.batches.find(x=>x.id===val('batch')),w=+val('washed'),p=+val('pass'),r=+val('rewash'),j=+val('reject');if(p+r+j>w)return toast('Disposition total exceeds inspected quantity.');b.washed=Math.max(b.washed,w);b.passed=p;b.rewash=r;b.reject=j;b.status='QC complete';close();nav('quality');toast('QC saved; pending disposition remains visible.')}}else if(type==='claim'){title='New reconciliation case';body=`<div class="formgrid">${f('Case ID','id','CLM-'+(303+S.claims.length))}${f('Source document','source','',null,[...S.collections.map(c=>c.id),...S.batches.map(b=>b.id),...S.dispatch.map(d=>d.id)])}${f('Customer','cust','',null,S.customers.map(c=>c.name))}${f('Issue','kind','',null,['Inbound quantity variance','Sorting discrepancy','Unwashed / process balance','Damage / quality dispute','Dispatch shortfall','Billing dispute','Other'])}${f('Quantity under review','qty',1,'number')}${f('Owner','owner','Customer service')}${f('Next action / evidence','note','Verify evidence and contract')}</div>`;save=()=>{S.claims.unshift({id:val('id'),source:val('source'),customer:val('cust'),kind:val('kind'),qty:+val('qty'),owner:val('owner'),status:'Open',note:val('note')});close();nav('claims');toast('Case created with owner.')}}else if(type==='dispatch'){title='Create dispatch manifest';body=`<div class="formgrid">${f('Dispatch ID','id','DSP-'+(7723+S.dispatch.length))}${f('Order','order','',null,S.orders.map(o=>o.id))}${f('Planned quantity','planned',500,'number')}${f('Packed quantity','packed',500,'number')}${f('Route','route','R-01')}${f('Driver','driver','DRV-007')}</div>`;save=()=>{let o=S.orders.find(x=>x.id===val('order')),p=+val('planned'),k=+val('packed');if(k>p)return toast('Packed cannot exceed planned without approved change.');S.dispatch.unshift({id:val('id'),customer:o.customer,order:o.id,planned:p,packed:k,delivered:0,status:'Ready',route:val('route')});close();nav('dispatch');toast('Dispatch created. Verify QC-released stock before release.')}}else if(type==='stock'){title='Stock movement';body=`<div class="formgrid">${f('Item','item','',null,S.stock.map(s=>s.item))}${f('Movement','movement','',null,['Receipt','Issue to customer','Return from customer','Cycle count adjustment','Retire / discard'])}${f('Quantity','qty',10,'number')}${f('Reference','ref','DOC-001')}</div>`;save=()=>{let s=S.stock.find(x=>x.item===val('item')),q=+val('qty'),m=val('movement');if(q<=0)return toast('Quantity must be positive.');if(['Issue to customer','Retire / discard'].includes(m)&&q>s.qty&&!S.rules.negative)return toast('Blocked: movement exceeds available clean stock.');if(['Receipt','Return from customer'].includes(m))s.qty+=q;else if(['Issue to customer','Retire / discard'].includes(m))s.qty-=q;close();nav('inventory');toast('Prototype stock updated. Production should post a traceable stock-ledger event.')}}else if(type==='maintenance'){title='Maintenance work order';body=`<div class="formgrid">${f('Work order','id','MWO-'+(200+S.machines.length))}${f('Asset','asset','',null,S.machines.map(m=>m.id+' — '+m.name))}${f('Type','type','',null,['Preventive','Breakdown','Calibration / inspection','Safety check'])}${f('Priority','priority','',null,['Normal','High','Critical'])}${f('Due date','due','2026-10-28')}${f('Description','desc','')}</div>`;save=()=>{S.events.unshift(['Now','Maintenance work order created',val('asset')+' · '+val('desc')]);close();nav('maintenance');toast('Maintenance work order recorded in demo activity.')}}else if(type==='shift'){title='Shift / skill assignment';body=`<div class="formgrid">${f('Employee / role','emp','OP-021')}${f('Shift','shift','',null,['Shift A 06:00–14:00','Shift B 14:00–22:00','Shift C 22:00–06:00'])}${f('Task','task','',null,['Dirty receiving','Sorting','Wash operation','Quality inspection','Packing','Dispatch / driving','Maintenance'])}${f('Skill verified','skill','',null,['Yes — evidence checked','No — do not assign controlled task','Refresh required'])}</div>`;save=()=>{if(val('skill')!=='Yes — evidence checked'&&val('task')==='Quality inspection')return toast('Do not assign controlled task until competency is verified.');close();toast('Assignment recorded in demo.')}}else if(type==='purchase'){title='Purchase request';body=`<div class="formgrid">${f('Request ID','id','PR-'+(400+S.stock.length))}${f('Category','cat','',null,['Linen replacement','Laundry chemical','Packaging','Machine spare','PPE','Utility service'])}${f('Quantity','qty',100,'number')}${f('Required by','due','2026-11-02')}${f('Reason','reason','Below par / planned demand')}${f('Requester','requester','Stores')}</div>`;save=()=>{close();toast('Purchase request recorded in demo; supplier and approval flow not connected.')}}else if(type==='compliance'){title='Hygiene / compliance check';body=`<div class="formgrid">${f('Check ID','id','CHK-'+(600+S.events.length))}${f('Control','control','',null,['Dirty/clean separation','Wash cycle evidence','PPE / safe handling','Chemical storage / SDS','Clean cart / packaging','Effluent / environmental','Incident / near miss','Corrective action'])}${f('Batch / site / asset','ref',S.active)}${f('Result','result','',null,['Pass','Fail — contain / escalate','Corrective action required'])}${f('Checked by','by','QA-001')}${f('Evidence / action due','evidence','')}</div>`;save=()=>{S.events.unshift(['Now','Compliance check: '+val('control'),val('result')+' · '+val('evidence')]);close();nav('compliance');toast('Check recorded. Failed controls require containment and follow-up.')}}else return;showModal(title,body,save)}
function quick(){showModal('Quick actions',`<div class="grid cols2">${[['Record collection','modal("collection")'],['Create wash batch','modal("batch")'],['Create service order','modal("order")'],['Record QC','modal("qc")'],['Create claim','modal("claim")'],['Create dispatch','modal("dispatch")']].map(x=>`<div class="card">${btn(x[0],x[1],'primary')}</div>`).join('')}</div>`,close)}function trace(id){let b=S.batches.find(x=>x.id===id);if(!b)return;S.active=id;showModal('Batch trace · '+id,`<div class="notice"><b>${b.customer}</b> · Source ${b.source} · ${b.kg} kg</div><div class="grid cols3">${kpi('Input',b.input,'Pieces')}${kpi('Sorted',b.sorted,'Pieces')}${kpi('Washed',b.washed,'Pieces')}${kpi('Passed',b.passed,'Pieces','green')}${kpi('Rewash',b.rewash,'Pieces','amber')}${kpi('Rejected',b.reject,'Pieces','red')}</div><div class="card" style="margin-top:12px"><h3>Reconciliation</h3>${[['Received input',b.input],['Difference input → sorted',b.input-b.sorted],['Difference sorted → washed',b.sorted-b.washed],['Passed QC',b.passed],['Rewash',b.rewash],['Rejected',b.reject],['Pending disposition',Math.max(0,b.washed-b.passed-b.rewash-b.reject)]].map(x=>`<div class="mini">${x[0]} <b style="float:right">${x[1]} pieces</b></div>`).join('')}<p class="sub">Machine: ${b.machine} · Recipe: ${b.recipe}</p></div><div class="actions" style="margin-top:12px">${btn('Record QC',`qcFor('${id}')`,'primary')}${btn('Create case','modal("claim")')}</div>`,close)}function showOrder(id){let o=S.orders.find(x=>x.id===id);showModal('Service order · '+id,`<div class="card">${[['Customer',o.customer],['Site',o.site],['Due',o.due],['Priority',o.priority],['Type',o.type],['Quantity',o.qty],['Status',o.status]].map(x=>`<div class="mini">${x[0]} <b style="float:right">${x[1]}</b></div>`).join('')}</div>`,close)}function updateOrder(id){let o=S.orders.find(x=>x.id===id);showModal('Update order · '+id,`<div class="field"><label>Status</label><select id="os">${['New','Scheduled','In production','Awaiting QC','Ready to pack','Dispatched','Delivered','On hold','Cancelled'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="notice warn">Status transitions should be checked against linked batch, QC, dispatch and permissions in a production build.</div>`,()=>{o.status=val('os');close();nav('orders');toast('Order status updated.')})}function batchFrom(id){modal('batch');setTimeout(()=>{document.getElementById('src').value=id;let c=S.collections.find(x=>x.id===id);document.getElementById('cust').value=c.customer;document.getElementById('input').value=c.received;document.getElementById('kg').value=c.kg},30)}function qcFor(id){modal('qc');setTimeout(()=>{document.getElementById('batch').value=id;let b=S.batches.find(x=>x.id===id);document.getElementById('washed').value=b.washed||b.sorted||b.input;document.getElementById('pass').value=b.passed;document.getElementById('rewash').value=b.rewash;document.getElementById('reject').value=b.reject},20)}function reconcile(id){let c=S.collections.find(x=>x.id===id);showModal('Reconcile · '+id,`<div class="grid cols2"><div class="card"><h3>Manifest quantities</h3><div class="mini">Declared <b style="float:right">${c.sent}</b></div><div class="mini">Received <b style="float:right">${c.received}</b></div><div class="mini">Variance <b style="float:right" class="${c.sent===c.received?'green':'red'}">${c.received-c.sent}</b></div><div class="mini">Weight <b style="float:right">${c.kg} kg</b></div></div><div class="card"><h3>Investigation</h3><div class="field"><label>Finding</label><select id="finding"><option>Awaiting recount</option><option>Customer declaration corrected with evidence</option><option>Receiving count corrected with evidence</option><option>Damage / contamination identified</option><option>Unresolved — escalate</option></select></div><div class="field"><label>Evidence reference</label><input id="evidence" value="Handover record / scale ticket"></div><div class="field"><label>Owner</label><input id="owner" value="Receiving supervisor"></div></div></div>`,()=>{let cl=S.claims.find(x=>x.source===id&&x.status!=='Resolved');if(cl){cl.note=val('finding')+' — '+val('evidence');cl.owner=val('owner');cl.status='Investigating'}close();nav('claims');toast('Investigation note saved; authorized closure still required.')})}function recPreview(){let c=S.collections.find(x=>x.id===document.getElementById('recSel').value);document.getElementById('recView').innerHTML=`<div class="mini">Declared <b style="float:right">${c.sent}</b></div><div class="mini">Received <b style="float:right">${c.received}</b></div><div class="mini">Variance <b class="${c.sent===c.received?'green':'red'}" style="float:right">${c.received-c.sent} pieces</b></div><div class="mini">Weight <b style="float:right">${c.kg} kg</b></div>`}function openPOD(id){let d=S.dispatch.find(x=>x.id===id);showModal('Dispatch / proof of delivery · '+id,`<div class="grid cols2"><div class="card"><h3>Manifest</h3>${[['Customer',d.customer],['Order',d.order],['Planned',d.planned],['Packed',d.packed],['Delivered',d.delivered],['Route',d.route]].map(x=>`<div class="mini">${x[0]} <b style="float:right">${x[1]}</b></div>`).join('')}</div><div class="card"><h3>Delivery evidence</h3><div class="field"><label>Delivered quantity</label><input id="delivered" type="number" value="${d.delivered||d.packed}"></div><div class="field"><label>Recipient</label><input id="recipient" value="Customer receiving representative"></div><div class="field"><label>Signature / exception reference</label><input id="podref" value="POD-SIGN-001"></div></div></div>`,()=>{let q=+val('delivered');if(q<0||q>d.packed)return toast('Delivered quantity must be between zero and packed quantity.');d.delivered=q;d.status=q===d.packed?'Delivered':'Delivery variance';if(q!==d.packed)S.claims.unshift({id:'CLM-'+(303+S.claims.length),source:id,customer:d.customer,kind:'Dispatch shortfall',qty:d.packed-q,owner:'Dispatch supervisor',status:'Open',note:'Investigate POD / '+val('podref')});S.events.unshift(['Now','POD recorded for '+id,`${q} of ${d.packed} pieces delivered`]);close();nav('dispatch');toast('POD saved. Delivery variance case opened if applicable.')})}function resolveClaim(id){let c=S.claims.find(x=>x.id===id);if(confirm('Resolve only if evidence and approval have been reviewed?')){c.status='Resolved';c.note+='; resolved by authorized reviewer';render();toast('Case resolved in prototype.')}}function openClaim(id){let c=S.claims.find(x=>x.id===id);showModal('Reconciliation case · '+id,`<div class="formgrid">${f('Source','source',c.source)}${f('Customer','customer',c.customer)}${f('Issue','kind',c.kind)}${f('Quantity','qty',c.qty,'number')}${f('Owner','owner',c.owner)}${f('Status','status',c.status,null,['Open','Investigating','Under review','Disputed','Resolved'])}<div class="field" style="grid-column:1/-1"><label>Finding / next action</label><textarea id="note">${c.note}</textarea></div></div>`,()=>{c.owner=val('owner');c.status=val('status');c.note=val('note');close();nav('claims');toast('Case updated.')})}function previewContract(id){let c=S.contracts.find(x=>x.id===id);toast(`${c.customer}: ${c.model}, ${money(c.rate)} per ${c.unit}. Validate against verified service evidence.`)}function submitInvoice(id){let i=S.invoices.find(x=>x.id===id);if(i.status==='Submitted')return toast('Invoice already submitted in demo.');if(S.claims.some(c=>c.customer===i.customer&&c.status!=='Resolved')&&!confirm('Customer has an open case. Continue only if disputed quantity is excluded or approved.'))return;i.status='Submitted';render();toast('Marked submitted in prototype; no accounting system contacted.')}function generateInvoice(){let o=S.orders.find(x=>x.status==='Delivered'||x.status==='Ready to pack');if(!o)return toast('No delivered / ready order found. Complete POD first or use a sample invoice.');let c=S.contracts.find(x=>x.customer===o.customer);if(!c)return toast('No contract found.');S.invoices.unshift({id:'INV-'+(3004+S.invoices.length),customer:o.customer,amount:o.qty*c.rate,basis:`${o.qty} × ${money(c.rate)} (preview; verify unit)`,status:'Draft'});nav('finance');toast('Draft invoice generated using simplified demo math. Validate contract billing unit.')}function stockMove(i){modal('stock');setTimeout(()=>document.getElementById('item').value=S.stock[i].item,20)}function editMachine(id){let m=S.machines.find(x=>x.id===id);showModal('Asset · '+id,`<div class="formgrid">${f('Status','status',m.status,null,['Available','Running','Down','Maintenance','Quarantined'])}${f('Maintenance condition','pm',m.pm)}${f('Rated capacity (kg)','cap',m.cap,'number')}</div>`,()=>{m.status=val('status');m.pm=val('pm');m.cap=+val('cap');close();nav('maintenance');toast('Asset updated.')})}function downtime(id){let m=S.machines.find(x=>x.id===id);showModal('Log downtime · '+id,`<div class="formgrid">${f('Reason','reason','',null,['Mechanical failure','Electrical','Cleaning / changeover','Utility interruption','Operator unavailable'])}${f('Duration minutes','minutes',30,'number')}${f('Action owner','owner','Maintenance team')}</div>`,()=>{m.status='Down';m.pm='Downtime: '+val('reason');S.events.unshift(['Now','Downtime logged · '+id,val('minutes')+' min · '+val('reason')]);close();nav('maintenance');toast('Machine marked down in prototype; replan affected batches.')})}function newOrder(id){modal('order');setTimeout(()=>{let c=S.customers.find(c=>c.id===id);document.getElementById('cust').value=c.name;document.getElementById('site').value=c.site},20)}function stockMoveTest(){}function saveSettings(){S.settings.site=val('site');S.settings.tax=+val('tax');S.settings.capacity=+val('cap');toast('Settings saved for demo session.')}function resetDemo(){if(confirm('Reset all records to original sample data?'))location.reload()}function report(name){let b=S.batches[0];showModal(name,`<div class="notice">Sample preview only. Production reports need date, customer, site, batch, machine and export filters.</div><div class="card"><h3>${name}</h3>${[['Example','WB-2206 / Grand Meridian Hotel'],['Source','1000 input → 980 sorted → 970 washed'],['Disposition','963 passed / 5 rewash / 2 rejected'],['Next action','Reconcile all stage differences with evidence']].map(x=>`<div class="mini">${x[0]} <b style="float:right">${x[1]}</b></div>`).join('')}</div>`,close)}function exportCSV(){let rows=[['Batch','Customer','Input','Sorted','Washed','Passed','Rewash','Rejected','Status'],...S.batches.map(b=>[b.id,b.customer,b.input,b.sorted,b.washed,b.passed,b.rewash,b.reject,b.status])];download('LinenFlow_Batch_Report.csv',rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}function exportBlueprint(){download('LinenFlow_ERP_Blueprint.txt','LinenFlow logical entities: Customer, Site, Contract, Service Order, Collection Manifest, Sort Lot, Wash Batch, Cycle Log, QC Inspection, Stock Ledger, Dispatch Manifest, POD, Reconciliation Case, Asset, Maintenance Work Order, Invoice, Compliance Check, Shift Assignment, Purchase Request.\nCritical controls: preserve declared and actual quantities; block dirty/held stock allocation; require cycle evidence and QC; dispatch <= released stock; POD before final billing; loss claims require evidence and approval; audit every correction.','text/plain')}function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Export prepared.')}
render();
